# SatGate OSS Gateway Configuration
# ==================================
# Example configuration for the open-source gateway.
#
# Supported policies:
#   - public: No authentication
#   - capability: Macaroon-based authentication
#   - l402: Lightning payment required
#
# Built-in endpoints (always available, no config needed):
#   - /health  - Health check
#   - /healthz - Health check (alias)

version: 1

server:
  listen: ":8080"

admin:
  # Generate with: openssl rand -hex 32
  # Or set CAPABILITY_ROOT_KEY environment variable
  capabilityRootKey: "${CAPABILITY_ROOT_KEY}"

# Lightning provider (required for l402 policy)
# Options: phoenixd, lnd, nwc (Nostr Wallet Connect), alby, mock, disabled
# Set LIGHTNING_BACKEND or LIGHTNING_PROVIDER env var (defaults to mock if neither set)
lightning:
  provider: "${LIGHTNING_BACKEND}${LIGHTNING_PROVIDER}"
  config:
    # NWC/Alby configuration (recommended - best routing):
    # Get connection string from Alby Hub: Settings → Wallet Connections → Add
    connectionString: "${NWC_CONNECTION_STRING}"
    # LND configuration (for Start9 via Tailscale):
    restUrl: "${LND_REST_URL}"
    macaroon: "${LND_MACAROON}"
    tlsCert: "${LND_TLS_CERT}"
    insecureSkipVerify: false
    # Phoenixd configuration:
    # apiUrl: "${PHOENIXD_URL}"
    # apiPassword: "${PHOENIXD_PASSWORD}"

# Upstreams (backend services)
upstreams:
  httpbin:
    url: "https://httpbin.org"
  # Add your own upstreams:
  # api:
  #   url: "http://localhost:3000"

# Routes - order matters! More specific routes should come first.
routes:
  # =====================================================
  # L402 Demo Routes (for satgate.io/pay demo page)
  # These demonstrate tiered pricing with Lightning payments
  # =====================================================
  
  - name: api-micro
    match:
      pathPrefix: /api/micro
    upstream: httpbin
    rewrite: /anything/micro   # Rewrite to httpbin's /anything endpoint
    policy:
      kind: l402
      priceSats: 1

  - name: api-basic
    match:
      pathPrefix: /api/basic
    upstream: httpbin
    rewrite: /anything/basic   # Rewrite to httpbin's /anything endpoint
    policy:
      kind: l402
      priceSats: 10

  - name: api-standard
    match:
      pathPrefix: /api/standard
    upstream: httpbin
    rewrite: /anything/standard   # Rewrite to httpbin's /anything endpoint
    policy:
      kind: l402
      priceSats: 100

  - name: api-premium
    match:
      pathPrefix: /api/premium
    upstream: httpbin
    rewrite: /anything/premium   # Rewrite to httpbin's /anything endpoint
    policy:
      kind: l402
      priceSats: 1000

  # =====================================================
  # General Demo Routes
  # =====================================================

  # Public route - no authentication required
  - name: public-demo
    match:
      pathPrefix: /public
    upstream: httpbin
    policy:
      kind: public

  # Protected route - requires valid Macaroon token
  - name: protected-demo
    match:
      pathPrefix: /protected
    upstream: httpbin
    policy:
      kind: capability
      scope: "api:read"

  # Paid route - requires Lightning payment (L402)
  - name: premium-demo
    match:
      pathPrefix: /premium
    upstream: httpbin
    policy:
      kind: l402
      priceSats: 100

  # Catch-all for httpbin testing (public)
  - name: httpbin
    match:
      pathPrefix: /
    upstream: httpbin
    policy:
      kind: public
