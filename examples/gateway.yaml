# SatGate OSS Gateway Configuration
# ==================================
# Example configuration for the open-source gateway.
#
# Supported policies:
#   - public: No authentication
#   - capability: Macaroon-based authentication
#   - l402: Lightning payment required
#
# Built-in endpoints (always available, no config needed):
#   - /health  - Health check
#   - /healthz - Health check (alias)

version: 1

server:
  listen: ":8080"

admin:
  # Generate with: openssl rand -hex 32
  # Or set CAPABILITY_ROOT_KEY environment variable
  capabilityRootKey: "${CAPABILITY_ROOT_KEY}"

# Lightning provider (optional, required for l402 policy)
lightning:
  provider: "mock"  # Options: phoenixd, lnd, mock, disabled
  # For phoenixd:
  # provider: phoenixd
  # config:
  #   apiUrl: "http://localhost:9740"
  #   apiPassword: "${PHOENIXD_PASSWORD}"

# Upstreams (backend services)
upstreams:
  httpbin:
    url: "https://httpbin.org"
  # Add your own upstreams:
  # api:
  #   url: "http://localhost:3000"

# Routes
routes:
  # Public route - no authentication required
  - name: public-demo
    match:
      pathPrefix: /public
    upstream: httpbin
    policy:
      kind: public

  # Protected route - requires valid Macaroon token
  - name: protected-demo
    match:
      pathPrefix: /api
    upstream: httpbin
    policy:
      kind: capability
      scope: "api:read"

  # Paid route - requires Lightning payment (L402)
  # Note: Requires lightning provider to be configured
  - name: premium-demo
    match:
      pathPrefix: /premium
    upstream: httpbin
    policy:
      kind: l402
      priceSats: 100

  # Catch-all for httpbin testing (public)
  - name: httpbin
    match:
      pathPrefix: /
    upstream: httpbin
    policy:
      kind: public
